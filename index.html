<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Telegram App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --sec-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #708499);
      --btn: var(--tg-theme-button-color, #5288c1);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--sec-bg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    #clear {
      background: none;
      border: none;
      color: var(--hint);
      font-size: 13px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: var(--btn);
      color: var(--btn-text);
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: var(--sec-bg);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    #input-box {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--sec-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    textarea {
      flex: 1;
      max-height: 110px;
      padding: 10px 14px;
      border-radius: 18px;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
    }

    button#send {
      padding: 0 16px;
      border-radius: 18px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: var(--btn);
      color: var(--btn-text);
    }

    button#send:disabled {
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Чат</h1>
    <button id="clear" type="button">Очистить</button>
  </header>

  <main id="chat">
    <div class="msg ai">Привет! Я подключен к Gemini. Напиши свой вопрос.</div>
  </main>

  <form id="input-box">
    <textarea id="prompt" rows="1" placeholder="Напиши сообщение..."></textarea>
    <button id="send" type="submit" disabled>↑</button>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const chat = document.getElementById('chat');
    const form = document.getElementById('input-box');
    const input = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const clearBtn = document.getElementById('clear');

    let history = [];

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 110) + 'px';
      sendBtn.disabled = input.value.trim().length === 0;
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) form.requestSubmit();
      }
    });

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    clearBtn.addEventListener('click', () => {
      history = [];
      chat.innerHTML = '<div class="msg ai">История очищена. Задай новый вопрос.</div>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMsg(text, 'user');
      history.push({ role: 'user', content: text });

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const loader = addMsg('Печатает...', 'ai');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        const reply = data.reply || data.error || 'Ошибка ответа';
        loader.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      } catch {
        loader.textContent = 'Ошибка соединения с сервером.';
      } finally {
        chat.scrollTop = chat.scrollHeight;
      }
    });
  </script>
</body>
</html>
